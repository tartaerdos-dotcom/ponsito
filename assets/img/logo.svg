<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <!-- Stile interno per il rendering del logo -->
  <style>
    .brand-mark { fill: none; stroke: #f97316; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .brand-grid { fill: none; stroke: #475569; stroke-width: 0.5; stroke-dasharray: 2 2; opacity: 0.6; }
    .brand-text-main { font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
    .brand-text-sub { font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 500; fill: #475569; letter-spacing: 2px; }
    @media (prefers-color-scheme: dark) {
      .brand-text-main { fill: #f8fafc; }
      .brand-text-sub { fill: #94a3b8; }
      .brand-grid { stroke: #94a3b8; }
    }
  </style>
  
  <!-- Griglia geometrica di sfondo (richiamo al disegno tecnico) -->
  <circle cx="30" cy="30" r="22" class="brand-grid" />
  <line x1="8" y1="30" x2="52" y2="30" class="brand-grid" />
  <line x1="30" y1="8" x2="30" y2="52" class="brand-grid" />
  <rect x="14" y="14" width="32" height="32" class="brand-grid" />

  <!-- Monogramma geometrico MB (M e B fuse in linee di costruzione) -->
  <!-- M path: (16,42) -> (16,18) -> (30,32) -> (30,18) ... o simile. Creiamo un tracciato pulito -->
  <path d="M 18,40 L 18,20 L 28,30 L 38,20 L 38,40" class="brand-mark" />
  <!-- B path: (28,30) -> (38,30) -> curve ... o facciamo un tracciato B che si sovrappone -->
  <path d="M 28,40 L 28,20 L 34,20 C 37,20 39,22 39,25 C 39,28 37,30 34,30 L 28,30 L 35,30 C 38,30 40,32 40,35 C 40,38 38,40 35,40 Z" class="brand-mark" style="stroke: #0284c7;" />

  <!-- Testo del Brand -->
  <text x="64" y="28" class="brand-text-main">STUDIO BERTELLI</text>
  <text x="64" y="44" class="brand-text-sub">GEOMETRA MARCO BERTELLI</text>
</svg>
