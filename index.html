<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esperienze didattiche</title>
<style>
  :root{
    --bg:#10131a; --bg2:#1a1f2b; --card:#ffffff; --ink:#1b2130; --muted:#5a6377;
    --accent:#c8102e; --gold:#e8b62c; --ring:rgba(232,182,44,.55);
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px 16px 32px;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:#eef1f7;
    background:radial-gradient(1200px 700px at 50% -10%,#2a3350 0%,var(--bg2) 45%,var(--bg) 100%);
    display:flex; flex-direction:column; align-items:center; gap:18px;
    min-height:100vh;
  }
  header{text-align:center; max-width:960px}
  h1{margin:0 0 6px; font-size:clamp(22px,3.8vw,34px); letter-spacing:1px; text-transform:uppercase}
  .step{font-size:14px; color:#b9c2d6; letter-spacing:.6px; text-transform:uppercase}
  .bar{width:min(960px,100%); height:6px; border-radius:999px; background:#2b3345; overflow:hidden; margin-top:10px}
  .bar i{display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--gold),var(--accent))}
  .card{
    flex:0 0 auto; width:min(960px,100%); background:var(--card); color:var(--ink);
    border-radius:18px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .card > h2{
    margin:0; padding:18px 24px; font-size:clamp(15px,2vw,18px); letter-spacing:.8px;
    text-transform:uppercase; color:var(--accent); border-bottom:4px solid var(--gold);
  }
  ul.elenco{list-style:none; margin:0; padding:0}
  ul.elenco li{border-bottom:1px solid #e7e9f0}
  ul.elenco li:last-child{border-bottom:0}
  a.voce{
    display:flex; align-items:center; gap:16px; text-decoration:none; color:var(--ink);
    padding:20px 24px; transition:background .15s ease;
  }
  a.voce:hover{background:#f4f5f8}
  a.voce .num{
    flex:0 0 auto; width:42px; height:42px; border-radius:50%;
    background:var(--accent); color:#fff; font-weight:700; font-size:17px;
    display:flex; align-items:center; justify-content:center;
  }
  a.voce .testo{flex:1 1 auto}
  a.voce .titolo{
    display:block; font-size:clamp(16px,2.2vw,20px); font-weight:700;
    color:var(--accent); text-transform:uppercase; letter-spacing:.3px;
  }
  a.voce .sub{display:block; margin-top:4px; font-size:15px; color:var(--muted); line-height:1.45}
  a.voce .freccia{flex:0 0 auto; font-size:22px; color:var(--gold)}
  footer{color:#8d97ad; font-size:13px; text-align:center; margin-top:auto}
  @media (max-width:640px){
    a.voce{padding:18px 16px; gap:12px}
    a.voce .num{width:36px; height:36px; font-size:15px}
  }
</style>
</head>
<body>

<header>
  <h1>Esperienze didattiche</h1>
  <div class="step">Raccolta dei percorsi</div>
  <div class="bar"><i></i></div>
</header>

<main class="card">
  <h2>Elenco delle esperienze</h2>
  <ul class="elenco">
    <li>
      <a class="voce" href="potenze1.html">
        <span class="num">1</span>
        <span class="testo">
          <span class="titolo">Conoscere le potenze attraverso una storia</span>
          <span class="sub">Il re, il cuoco e le potenze &middot; racconto illustrato in 13 scene, con audio.</span>
        </span>
        <span class="freccia">&rarr;</span>
      </a>
    </li>
  </ul>
</main>

<footer>Seleziona un&rsquo;esperienza per iniziare il percorso.</footer>

</body>
</html>
